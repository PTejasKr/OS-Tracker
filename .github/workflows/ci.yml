name: CI — Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend — Install & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os-tracker-backend

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: os-tracker-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server can start (syntax check)
        run: node -e "require('./server.js')" &
        env:
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret
        timeout-minutes: 1
        continue-on-error: true

  frontend-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os-tracker-frontend

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: os-tracker-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: true
